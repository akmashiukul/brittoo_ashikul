services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    container_name: brittoo-server-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - GRPC_PORT=50051
      - CLIENT_BASE_URL=http://localhost:5173
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://brittoo:brittoo_dev_pass@postgres:5432/brittoodb_dev
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - brittoo-dev

  agentic:
    build:
      context: .
      dockerfile: agentic-service/Dockerfile.dev
    container_name: brittoo-agentic-dev
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./agentic-service/.env
    environment:
      - PORT=5001
      - NODE_ENV=development
      - MONGODB_URI=mongodb://galib:Brittoo%401234@mongo:27017/negotiations_dev?authSource=admin
      - GRPC_SERVER_URL=server:50051
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./agentic-service:/app/agentic-service
      - /app/agentic-service/node_modules
      - ./server/lib:/app/server/lib
    depends_on:
      - server
      - mongo
      - redis
    networks:
      - brittoo-dev

  postgres:
    image: postgres:16-alpine
    container_name: brittoo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: brittoodb_dev
      POSTGRES_USER: brittoo
      POSTGRES_PASSWORD: brittoo_dev_pass
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brittoo -d brittoodb_dev"] 
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - brittoo-dev

  mongo:
    image: mongo:7-jammy
    container_name: brittoo-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: galib
      MONGO_INITDB_ROOT_PASSWORD: "Brittoo@1234"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - brittoo-dev

  redis:
    image: redis:7-alpine
    container_name: brittoo-redis-dev
    restart: unless-stopped
    networks:
      - brittoo-dev

volumes:
  postgres_dev_data:
  mongo_dev_data:

networks:
  brittoo-dev:
    driver: bridge