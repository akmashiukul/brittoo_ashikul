name: "Brittoo"

services:

  britto-backend:
    build:
      context: ./server
      args:
        - NODE_ENV=development
    ports:
      - "5000:5000"
    # Vol-mountin - Sync docker and host
    volumes:
      - ./server:/app:ro
      - /app/node_modules
    #environment:
    #  - PORT=5000
    env_file:
      - ./server/.env
    command: npm run dev

  britto-frontend:
    

# ===========================================
# DEV COMMANDS (using docker-compose.dev.yml)
# ===========================================

#   --Up (start in detached mode):
#       $ docker compose -f docker-compose.dev.yml up -d

#   --List images (confirm image is built):
#       $ docker image ls

#   --Down & Delete anonymous volumes:
#       $ docker compose -f docker-compose.dev.yml down -v

#   --Force rebuild from scratch (no cache):
#       $ docker compose -f docker-compose.dev.yml up -d --build



