name: Deploy Brittoo to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "Starting deployment..."
          
          # Load NVM environment
          export NVM_DIR="/root/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
          
          # THIS LINE WAS MISSING - Activate Node.js
          nvm use node
          
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          
          cd /var/www/brittoo
          
          echo "Pulling latest code..."
          git pull origin main
          
          echo "Building frontend..."
          cd client
          npm install --silent
          npm run build
          cd ..
          
          echo "Installing backend dependencies..."
          cd server
          npm install --silent
          cd ..
          
          echo "Restarting nginx..."
          sudo systemctl reload nginx
          
          # Find and use PM2
          echo "Restarting backend..."
          npm list -g pm2 > /dev/null 2>&1 && PM2_AVAILABLE=true || PM2_AVAILABLE=false
          
          if [ "$PM2_AVAILABLE" = true ]; then
            pm2 restart brittoo-backend || pm2 start server/index.js --name brittoo-backend
          else
            echo "PM2 not found globally, trying npx..."
            npx pm2 restart brittoo-backend || npx pm2 start server/index.js --name brittoo-backend
          fi
          
          echo "Deployment completed!"